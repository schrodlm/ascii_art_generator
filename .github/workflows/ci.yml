# Runs every test on each push and pull request: core on the JVM and on JS, the CLI, the JS library
# against the development and the minified build, the npm package as installed, and the types.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@v1.5.14
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package/package-lock.json
      - run: npm ci
        working-directory: js/package
      - run: sbt test
